<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>SchülerWLAN · Community</title><link rel="stylesheet" href="/static/community.css"><script src="/static/community.js" defer></script></head><body><header><a href="/">SchülerWLAN</a><nav><button data-view="chat" class="active">Chat</button><button data-view="games">Games</button></nav><span id="online">0 online</span></header><main><section id="profile"><label>Dein Name<input id="name" maxlength="24" autocomplete="nickname"></label><button id="save-name">Speichern</button></section><section id="chat" class="view"><aside><h2>Online</h2><ul id="people"></ul></aside><div class="chat-room"><div id="messages" aria-live="polite"></div><form id="chat-form"><input id="message" maxlength="300" placeholder="Nachricht schreiben …" autocomplete="off"><button>Senden</button></form></div></section><section id="games" class="view" hidden><div class="game-tabs"><button data-game="pong" class="active">Pong</button><button data-game="ttt">Drei gewinnt</button></div><article id="pong-game"><div class="game-heading"><div><h1>Pong</h1><p id="pong-status">Raum wird geladen …</p></div><button id="pong-join">Mitspielen</button></div><canvas id="pong" width="900" height="520" aria-label="Pong-Spielfeld"></canvas><p class="hint">Ziehe oder bewege den Finger über das Spielfeld, um deinen Schläger zu steuern. Das erste Team mit 7 Punkten gewinnt.</p></article><article id="ttt-game" hidden><div class="game-heading"><div><h1>Drei gewinnt</h1><p id="ttt-status">Raum wird geladen …</p></div><button id="ttt-join">Mitspielen</button></div><div id="ttt-board" aria-label="Drei-gewinnt-Spielfeld"></div><button id="ttt-reset" class="secondary">Neue Runde</button></article></section><p id="error" role="status"></p></main></body></html>
